name: ci-build-test

on:
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  go-versions:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      stable: ${{ steps.versions.outputs.GO_MINOR_VERSION_STABLE }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine Go versions
        id: versions
        uses: carabiner-dev/actions/go/versions@32587e82f960d49b36101e8c45d1956e511965d3 # v1.2.9

  build:
    name: build
    needs: go-versions
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.go-versions.outputs.stable }}
          check-latest: true
          cache: true

      - name: build
        run: make vex

  test-matrix:
    name: Go Tests (${{ matrix.os }})
    needs: go-versions
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.go-versions.outputs.stable }}
          check-latest: true
          cache: true

      - name: Test
        run: go test -race -v ./...

  # Gate job with a stable name for branch protection. Fails if any
  # matrix leg failed or was cancelled.
  test:
    name: test
    needs: test-matrix
    if: always()
    runs-on: ubuntu-latest

    permissions: {}

    steps:
      - name: Check test matrix result
        env:
          RESULT: ${{ needs.test-matrix.result }}
        run: |
          echo "test matrix result: ${RESULT}"
          if [ "${RESULT}" != "success" ]; then
            exit 1
          fi
